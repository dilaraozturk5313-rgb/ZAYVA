const DEFAULT={version:VERSION,settings:{onboarded:false,language:'sv',currency:'SEK',theme:'signature',incomeDay:25},fixedTemplates:[],categoryTemplates:[],periods:{},goals:[],notes:[],focus:['income','remaining','saved','spent'],ui:{periodKey:monthKey(new Date())}};
let state=load();let onboardingStep=1;
const root=document.getElementById('root');
function clone(x){return JSON.parse(JSON.stringify(x))}
function load(){try{const raw=localStorage.getItem(STORAGE);return raw?Object.assign(clone(DEFAULT),JSON.parse(raw)):clone(DEFAULT)}catch{return clone(DEFAULT)}}
function persist(){localStorage.setItem(STORAGE,JSON.stringify(state));render()}
function t(k){return (L[state.settings.language]||L.sv)[k]||k}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function monthKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function parseKey(k){const [y,m]=k.split('-').map(Number);return {y,m:m-1}}
function shiftKey(k,n){const {y,m}=parseKey(k);const d=new Date(y,m+n,1);return monthKey(d)}
function daysInMonth(y,m){return new Date(y,m+1,0).getDate()}
function adjustedIncomeDate(y,m,day){const d=new Date(y,m,Math.min(day,daysInMonth(y,m)));const w=d.getDay();if(w===6)d.setDate(d.getDate()-1);if(w===0)d.setDate(d.getDate()-2);return d}
function periodBounds(key){const {y,m}=parseKey(key);const start=adjustedIncomeDate(y,m-1,state.settings.incomeDay);const next=adjustedIncomeDate(y,m,state.settings.incomeDay);const end=new Date(next);end.setDate(end.getDate()-1);return {start,end,next}}
function dateISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDate(d){return new Intl.DateTimeFormat(state.settings.language==='sv'?'sv-SE':'en-GB',{day:'numeric',month:'short',year:'numeric'}).format(d)}
function periodTitle(k){const {y,m}=parseKey(k);return new Intl.DateTimeFormat(state.settings.language==='sv'?'sv-SE':'en-GB',{month:'long',year:'numeric'}).format(new Date(y,m,1))}
function periodKeyForDate(iso){const d=new Date(iso+'T12:00:00');const base=monthKey(d);for(let n=-2;n<=2;n++){const k=shiftKey(base,n),b=periodBounds(k);if(d>=b.start&&d<=b.end)return k}return state.ui.periodKey}

function money(v){if(v===null||v===undefined||Number.isNaN(Number(v)))return '—';return new Intl.NumberFormat(state.settings.language==='sv'?'sv-SE':'en-GB',{style:'currency',currency:state.settings.currency,maximumFractionDigits:0}).format(Number(v))}
function numOrNull(v){if(v===null||v===undefined||String(v).trim()==='')return null;const n=Number(v);return Number.isFinite(n)?n:null}

function period(){return ensurePeriod(state.ui.periodKey)}
function activeFixed(){return state.fixedTemplates.filter(f=>f.active!==false)}
function fixedTotal(){return activeFixed().reduce((s,f)=>s+(Number(f.amount)||0),0)}
function purchases(p=period()){return p.transactions.filter(x=>x.type==='purchase')}
function spentTotal(p=period()){return purchases(p).reduce((s,x)=>s+(Number(x.amount)||0),0)}
function savedTotal(p=period()){return p.savings.reduce((s,x)=>s+(Number(x.amount)||0),0)}
function budgetTotal(p=period()){return Object.values(p.categoryBudgets).reduce((s,v)=>s+(Number(v)||0),0)}
function usedWhole(p=period()){return fixedTotal()+spentTotal(p)}
function remainingWhole(p=period()){if(p.income===null)return null;return Number(p.income)-usedWhole(p)}
function catSpent(id,p=period()){return purchases(p).filter(x=>x.categoryId===id).reduce((s,x)=>s+(Number(x.amount)||0),0)}
function catBudget(id,p=period()){return p.categoryBudgets[id]??null}
function pct(a,b){if(!b||b<=0)return 0;return Math.max(0,Math.min(100,(a/b)*100))}
function placeholderAmount(){return t('emptyPlaceholder')}

<header class="topbar"><div><div class="brand">ZAYVA</div><div class="tagline">${t('tag')}</div></div><div class="period-select"><button data-shift="-1">‹</button><b>${esc(periodTitle(state.ui.periodKey))}</b><button data-shift="1">›</button></div></header>

<div class="grid">${metricCard('income',t('income'),income,t('editIncome'),true)}${metricCard('remaining',t('remaining'),rem,t('fixedCostsSub'))}${metricCard('spent',t('spent'),p.transactions.length?spentTotal(p):null,t('thisPeriod'))}${metricCard('saved',t('saved'),p.savings.length?savedTotal(p):null,t('thisPeriod'))}</div>
<div class="card overview-budget" style="margin-top:10px">${budgetOverviewHTML(p,income,used,rem)}</div>

<section id="purchase" class="section"><div class="card quick-card"><h3>${t('quick')}</h3><p>${t('newPurchase')}</p>${quickFormHTML()}</div></section>

<section id="savings" class="section"><div class="section-title"><h2>${t('savings')}</h2><button class="btn secondary" data-action="add-saving">${t('addSaving')}</button></div>${savingsHTML()}<div class="section-title" style="margin-top:18px"><h2>${t('goals')}</h2><button class="btn secondary" data-action="add-goal">${t('addGoal')}</button></div><div class="savings-goals">${goalsHTML()}</div></section>
<section class="section"><div class="section-title"><h2>${t('transactions')}</h2></div><div class="card history">${transactionsHTML()}</div></section>
</div>${navHTML()}`}
function metricCard(id,label,val,sub,click=false){return `<div class="card metric ${click?'clickable':''}" ${click?'data-action="edit-income"':''}><div class="label">${label}</div><div class="value">${money(val)}</div><div class="sub">${sub}</div></div>`}
function budgetOverviewHTML(p,income,used,rem){const denominator=income||0;return `<div class="budget-head"><div><div class="tiny">${t('usedOfBudget')}</div><div class="budget-used"><b>${money(income===null?null:used)}</b> ${t('of')} ${money(income)}</div></div><div class="tiny">${t('fixedCosts')}: ${money(activeFixed().some(f=>f.amount!==null&&f.amount!==undefined)?fixedTotal():null)}</div></div><div class="progress"><span style="width:${pct(used,denominator)}%"></span></div><div class="remaining-block"><div class="tiny">${t('remaining')}</div><div class="big-money">${money(rem)}</div></div>`}
function quickFormHTML(catId=''){const p=period(),b=periodBounds(state.ui.periodKey);const today=new Date();let d=(today>=b.start&&today<=b.end)?dateISO(today):dateISO(b.start);return `<form id="quick-form"><div class="form-row"><div class="field"><label>${t('amount')}</label><input name="amount" inputmode="decimal" placeholder="${placeholderAmount()}" required></div><div class="field"><label>${t('category')}</label><select name="category" required><option value="">—</option>${state.categoryTemplates.map(c=>`<option value="${c.id}" ${c.id===catId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div></div><div class="form-row"><div class="field"><label>${t('date')}</label><input name="date" type="date" value="${d}"></div><div class="field"><label>${t('description')}</label><input name="title" placeholder="${t('description')}"></div></div><div class="field"><label>${t('note')}</label><input name="note" placeholder="${t('note')}"></div><button class="btn wide" type="submit">${t('register')}</button></form>`}
function categoryListHTML(){if(!state.categoryTemplates.length)return `<div class="card empty">${t('chooseFive')}</div>`;const p=period();return state.categoryTemplates.map(c=>{const b=catBudget(c.id,p),s=catSpent(c.id,p),r=b===null?null:Number(b)-s;return `<button class="cat-row" data-category="${c.id}"><div class="top"><div class="name"><span>${esc(c.icon||'○')}</span><span>${esc(c.name)}</span></div><b>${money(r)}</b></div><div class="meta">${t('catSpent')}: ${money(s)} · ${t('catBudget')}: ${money(b)}</div><div class="progress"><span style="width:${pct(s,b)}%"></span></div></button>`}).join('')}
function fixedCostsHTML(){const list=activeFixed();return `<div class="fixed-box"><div class="fixed-head"><div><h3>${t('fixedCosts')}</h3><div class="tiny-note">${t('fixedCostsSub')}</div></div><button class="btn secondary" data-action="open-more">${t('edit')}</button></div>${list.length?list.map(f=>`<div class="fixed-line"><span>${esc(f.name)}</span><b>${money(f.amount)}</b></div>`).join(''):`<div class="empty">${t('fixedCosts')}</div>`}<div class="fixed-total"><span>${t('totalFixed')}</span><span>${money(activeFixed().some(f=>f.amount!==null&&f.amount!==undefined)?fixedTotal():null)}</span></div></div>`}
function transactionsHTML(){const xs=[...purchases()].sort((a,b)=>b.date.localeCompare(a.date));if(!xs.length)return `<div class="empty">${t('noTransactions')}</div>`;return xs.slice(0,20).map(x=>{const c=state.categoryTemplates.find(c=>c.id===x.categoryId);return `<div class="tx"><div class="left"><b>${esc(x.title||c?.name||t('purchase'))}</b><small>${esc(c?.name||'')} · ${esc(x.date)}</small></div><b>−${money(x.amount)}</b></div>`}).join('')}
function savingsHTML(){const p=period();return `<div class="card"><div class="remaining-block" style="border:0;padding-top:0"><div class="tiny">${t('periodSavings')}</div><div class="big-money">${money(savedTotal(p)||null)}</div></div>${p.savings.length?p.savings.map(s=>`<div class="tx"><div class="left"><b>${esc(s.note||t('savings'))}</b><small>${esc(s.date)}</small></div><b>${money(s.amount)}</b></div>`).join(''):`<div class="empty">${t('noSavings')}</div>`}</div>`}
function goalsHTML(){if(!state.goals.length)return `<div class="card empty">${t('addGoal')}</div>`;return state.goals.map(g=>`<div class="goal clickable" data-goal="${g.id}"><div class="head"><b>${esc(g.name)}</b><span>${money(g.current)} / ${money(g.target)}</span></div><div class="progress"><span style="width:${pct(g.current,g.target)}%"></span></div></div>`).join('')}
function navHTML(){return `<nav class="bottom-nav"><button data-scroll="overview"><span class="nav-icon">⌂</span>${t('overview')}</button><button data-scroll="budget"><span class="nav-icon">▤</span>${t('budget')}</button><button class="more-btn" data-action="open-more"><span class="more-circle">•••</span>${t('more')}</button><button data-scroll="purchase"><span class="nav-icon">◇</span>${t('purchase')}</button><button data-scroll="savings"><span class="nav-icon">◎</span>${t('savings')}</button></nav>`}
function bindMain(){document.querySelectorAll('[data-shift]').forEach(b=>b.onclick=()=>{state.ui.periodKey=shiftKey(state.ui.periodKey,Number(b.dataset.shift));ensurePeriod(state.ui.periodKey);persist()});document.querySelectorAll('[data-scroll]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.scroll)?.scrollIntoView({behavior:'smooth',block:'start'}));document.querySelectorAll('[data-action="open-more"]').forEach(b=>b.onclick=openMore);document.querySelectorAll('[data-action="edit-income"]').forEach(b=>b.onclick=editIncome);document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>categorySheet(b.dataset.category));document.querySelector('[data-action="add-saving"]')?.addEventListener('click',savingSheet);document.querySelector('[data-action="add-goal"]')?.addEventListener('click',()=>goalSheet());document.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>goalSheet(b.dataset.goal));const form=document.getElementById('quick-form');if(form)form.onsubmit=e=>{e.preventDefault();const fd=new FormData(form);registerPurchase(fd);form.reset();render()}}
function registerPurchase(fd,forcedCat){const amount=numOrNull(fd.get('amount'));if(amount===null||amount<=0)return;const date=String(fd.get('date')||dateISO(new Date()));const key=periodKeyForDate(date);const p=ensurePeriod(key);const cat=forcedCat||String(fd.get('category')||'');if(!cat)return;p.transactions.push({id:uid(),type:'purchase',amount,categoryId:cat,date,title:String(fd.get('title')||''),note:String(fd.get('note')||'')});localStorage.setItem(STORAGE,JSON.stringify(state))}
function showSheet(html){const wrap=document.createElement('div');wrap.className='sheet-backdrop';wrap.innerHTML=`<div class="sheet">${html}</div>`;document.body.appendChild(wrap);wrap.addEventListener('click',e=>{if(e.target===wrap)wrap.remove()});wrap.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>wrap.remove());return wrap}
function sheetHead(title){return `<div class="sheet-head"><h2>${title}</h2><button class="close" data-close>×</button></div>`}
function editIncome(){const p=period();const s=showSheet(`${sheetHead(t('periodIncome'))}<div class="field"><label>${t('income')}</label><input id="income-edit" inputmode="decimal" value="${p.income??''}" placeholder="${placeholderAmount()}"></div><div class="tiny-note">${esc(periodTitle(state.ui.periodKey))} · ${fmtDate(periodBounds(state.ui.periodKey).start)} – ${fmtDate(periodBounds(state.ui.periodKey).end)}</div><button class="btn wide" id="save-income">${t('save')}</button>`);s.querySelector('#save-income').onclick=()=>{p.income=numOrNull(s.querySelector('#income-edit').value);s.remove();persist()}}
function categorySheet(id){const c=state.categoryTemplates.find(x=>x.id===id);if(!c)return;const p=period(),b=catBudget(id,p),sp=catSpent(id,p),rem=b===null?null:Number(b)-sp;const s=showSheet(`${sheetHead(esc(c.name))}<div class="grid"><div class="card metric"><div class="label">${t('catBudget')}</div><div class="value">${money(b)}</div></div><div class="card metric"><div class="label">${t('catSpent')}</div><div class="value">${money(sp)}</div></div></div><div class="card metric" style="margin-top:10px"><div class="label">${t('catRemaining')}</div><div class="value">${money(rem)}</div><div class="progress"><span style="width:${pct(sp,b)}%"></span></div></div><div class="card" style="margin-top:10px"><h3>${t('editBudget')}</h3><div class="field"><input id="period-budget" inputmode="decimal" value="${b??''}" placeholder="${placeholderAmount()}"></div><button class="btn secondary wide" id="save-period-budget">${t('save')}</button></div><div class="card quick-card" style="margin-top:10px"><h3>${t('registerHere')}</h3>${quickFormHTML(id)}</div>`);s.querySelector('#save-period-budget').onclick=()=>{p.categoryBudgets[id]=numOrNull(s.querySelector('#period-budget').value);s.remove();persist()};const f=s.querySelector('#quick-form');f.onsubmit=e=>{e.preventDefault();registerPurchase(new FormData(f),id);s.remove();render()}}
function savingSheet(){const b=periodBounds(state.ui.periodKey);const s=showSheet(`${sheetHead(t('addSaving'))}<div class="field"><label>${t('amount')}</label><input id="sav-amt" inputmode="decimal" placeholder="${placeholderAmount()}"></div><div class="field"><label>${t('date')}</label><input id="sav-date" type="date" value="${dateISO(b.start)}"></div><div class="field"><label>${t('note')}</label><input id="sav-note" placeholder="${t('note')}"></div><button class="btn wide" id="sav-save">${t('save')}</button>`);s.querySelector('#sav-save').onclick=()=>{const a=numOrNull(s.querySelector('#sav-amt').value);if(a!==null&&a>0){period().savings.push({id:uid(),amount:a,date:s.querySelector('#sav-date').value,note:s.querySelector('#sav-note').value});s.remove();persist()}}}
function goalSheet(id){const g=state.goals.find(x=>x.id===id);const s=showSheet(`${sheetHead(g?esc(g.name):t('addGoal'))}<div class="field"><label>${t('goalName')}</label><input id="g-name" value="${esc(g?.name||'')}"></div><div class="form-row"><div class="field"><label>${t('target')}</label><input id="g-target" inputmode="decimal" value="${g?.target??''}" placeholder="${placeholderAmount()}"></div><div class="field"><label>${t('current')}</label><input id="g-current" inputmode="decimal" value="${g?.current??''}" placeholder="${placeholderAmount()}"></div></div><button class="btn wide" id="g-save">${t('save')}</button>${g?`<button class="btn danger wide" style="margin-top:8px" id="g-del">${t('delete')}</button>`:''}`);s.querySelector('#g-save').onclick=()=>{const obj={id:g?.id||uid(),name:s.querySelector('#g-name').value.trim()||t('goals'),target:numOrNull(s.querySelector('#g-target').value),current:numOrNull(s.querySelector('#g-current').value)};if(g)Object.assign(g,obj);else state.goals.push(obj);s.remove();persist()};s.querySelector('#g-del')?.addEventListener('click',()=>{state.goals=state.goals.filter(x=>x.id!==g.id);s.remove();persist()})}
function openMore(){const p=period();const s=showSheet(`${sheetHead(t('more'))}<div class="settings-list">
<div class="settings-block"><h3>${t('settings')}</h3><div class="row"><span>${t('language')}</span><select id="set-lang"><option value="sv" ${state.settings.language==='sv'?'selected':''}>Svenska</option><option value="en" ${state.settings.language==='en'?'selected':''}>English</option></select></div><div class="row"><span>${t('currency')}</span><select id="set-cur">${['SEK','EUR','USD','GBP','NOK','DKK'].map(c=>`<option ${state.settings.currency===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="row"><span>${t('theme')}</span><select id="set-theme">${Object.entries(THEMES).map(([k,v])=>`<option value="${k}" ${state.settings.theme===k?'selected':''}>${v.label}</option>`).join('')}</select></div></div>
<div class="settings-block"><h3>${t('budgetCycle')}</h3><div class="row"><span>${t('incomeDay')}</span><input id="set-day" type="number" min="1" max="31" value="${state.settings.incomeDay}"></div><div class="tiny-note">${t('incomeDayHint')}<br>${fmtDate(periodBounds(state.ui.periodKey).start)} – ${fmtDate(periodBounds(state.ui.periodKey).end)}</div></div>
<div class="settings-block"><h3>${t('periodIncome')}</h3><div class="row"><span>${esc(periodTitle(state.ui.periodKey))}</span><input id="set-income" inputmode="decimal" value="${p.income??''}" placeholder="${placeholderAmount()}"></div></div>
<div class="settings-block"><h3>${t('fixedEditor')}</h3><div class="tiny-note">${t('fixedCarry')}</div><div id="fixed-editor" class="editable-list">${fixedEditorHTML()}</div><button class="btn secondary" id="add-fixed" style="margin-top:8px">${t('add')}</button></div>
<div class="settings-block"><h3>${t('defaultBudget')}</h3><div class="tiny-note">${t('templateNote')}</div><div id="cat-editor" class="editable-list" style="margin-top:9px">${categoryEditorHTML()}</div><button class="btn secondary" id="add-cat" style="margin-top:8px">${t('add')}</button></div>
<div class="settings-block"><h3>${t('focusEditor')}</h3><div class="focus-pills">${['income','remaining','spent','saved'].map(k=>`<button data-focus="${k}" class="${state.focus.includes(k)?'active':''}">${t(k)}</button>`).join('')}</div></div>
<div class="settings-block"><h3>${t('notes')}</h3><div class="field"><textarea id="notes-box" placeholder="${t('notes')}">${esc(state.notes[0]?.text||'')}</textarea></div></div>
<button class="btn wide" id="save-more">${t('save')}</button><button class="btn danger wide" style="margin-top:8px" id="reset-app">${t('reset')}</button>
</div>`);bindMoreSheet(s)}
function fixedEditorHTML(){return state.fixedTemplates.map(f=>`<div class="editable-item" data-fixed-row="${f.id}"><input data-name value="${esc(f.name)}"><input data-amount inputmode="decimal" value="${f.amount??''}" placeholder="${placeholderAmount()}"><button data-remove-fixed="${f.id}">×</button></div>`).join('')}
function categoryEditorHTML(){return state.categoryTemplates.map(c=>`<div class="editable-item" data-cat-row="${c.id}"><input data-name value="${esc(c.name)}"><input data-amount inputmode="decimal" value="${c.defaultBudget??''}" placeholder="${placeholderAmount()}"><button data-remove-cat="${c.id}">×</button></div>`).join('')}
function bindMoreSheet(s){s.querySelector('#add-fixed').onclick=()=>{state.fixedTemplates.push({id:uid(),name:'',amount:null,active:true});s.remove();persist();openMore()};s.querySelector('#add-cat').onclick=()=>{state.categoryTemplates.push({id:uid(),name:t('other'),icon:'○',defaultBudget:null});s.remove();persist();openMore()};s.querySelectorAll('[data-remove-fixed]').forEach(b=>b.onclick=()=>{state.fixedTemplates=state.fixedTemplates.filter(x=>x.id!==b.dataset.removeFixed);s.remove();persist();openMore()});s.querySelectorAll('[data-remove-cat]').forEach(b=>b.onclick=()=>{const id=b.dataset.removeCat;state.categoryTemplates=state.categoryTemplates.filter(x=>x.id!==id);Object.values(state.periods).forEach(p=>delete p.categoryBudgets[id]);s.remove();persist();openMore()});s.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{const k=b.dataset.focus;state.focus=state.focus.includes(k)?state.focus.filter(x=>x!==k):[...state.focus,k];b.classList.toggle('active')});s.querySelector('#save-more').onclick=()=>{state.settings.language=s.querySelector('#set-lang').value;state.settings.currency=s.querySelector('#set-cur').value;state.settings.theme=s.querySelector('#set-theme').value;state.settings.incomeDay=Math.max(1,Math.min(31,Number(s.querySelector('#set-day').value)||25));p.income=numOrNull(s.querySelector('#set-income').value);s.querySelectorAll('[data-fixed-row]').forEach(r=>{const f=state.fixedTemplates.find(x=>x.id===r.dataset.fixedRow);if(f){f.name=r.querySelector('[data-name]').value.trim()||t('fixedCosts');f.amount=numOrNull(r.querySelector('[data-amount]').value)}});s.querySelectorAll('[data-cat-row]').forEach(r=>{const c=state.categoryTemplates.find(x=>x.id===r.dataset.catRow);if(c){c.name=r.querySelector('[data-name]').value.trim()||t('other');c.defaultBudget=numOrNull(r.querySelector('[data-amount]').value)}});state.notes=[{id:'main-note',text:s.querySelector('#notes-box').value}];s.remove();persist()};s.querySelector('#reset-app').onclick=()=>{if(confirm(t('confirmReset'))){localStorage.removeItem(STORAGE);state=clone(DEFAULT);s.remove();render()}}}
function renderOnboarding(){applyTheme();root.innerHTML=`<div class="onboarding"><div class="on-card"><div class="brand">ZAYVA</div><div class="step">${onboardingStep} / 6</div>${onboardingBody()}<div class="on-actions">${onboardingStep>1?`<button class="btn secondary" id="on-back">${t('back')}</button>`:'<span></span>'}<button class="btn" id="on-next">${onboardingStep===6?t('finish'):t('next')}</button></div></div></div>`;bindOnboarding()}
function onboardingBody(){if(onboardingStep===1)return `<h1>${t('onboarding1')}</h1><div class="option-grid"><button class="option ${state.settings.language==='sv'?'selected':''}" data-lang="sv">Svenska</button><button class="option ${state.settings.language==='en'?'selected':''}" data-lang="en">English</button></div>`;if(onboardingStep===2)return `<h1>${t('onboarding2')}</h1><div class="field"><select id="on-currency">${['SEK','EUR','USD','GBP','NOK','DKK'].map(c=>`<option ${state.settings.currency===c?'selected':''}>${c}</option>`).join('')}</select></div>`;if(onboardingStep===3)return `<h1>${t('onboarding3')}</h1><div class="option-grid">${Object.entries(THEMES).map(([k,v])=>`<button class="option ${state.settings.theme===k?'selected':''}" data-theme="${k}"><div class="theme-dot" style="background:${v.accent}"></div><b>${v.label}</b></button>`).join('')}</div>`;if(onboardingStep===4)return `<h1>${t('onboarding4')}</h1><p>${t('incomeDayHint')}</p><div class="field"><label>${t('incomeDay')}</label><input id="on-day" type="number" min="1" max="31" value="${state.settings.incomeDay}"></div>`;if(onboardingStep===5){if(!state.fixedTemplates.length)state.fixedTemplates=[{id:uid(),name:t('rent'),amount:null,active:true},{id:uid(),name:t('fee'),amount:null,active:true},{id:uid(),name:t('mortgage'),amount:null,active:true},{id:uid(),name:t('loan'),amount:null,active:true},{id:uid(),name:t('insurance'),amount:null,active:true}];return `<h1>${t('onboarding5')}</h1><p>${t('optionalAmounts')}</p><div class="editable-list" id="on-fixed">${fixedEditorHTML()}</div><button class="btn secondary" id="on-add-fixed" style="margin-top:10px">${t('add')}</button>`}if(onboardingStep===6){const candidates=[t('food'),t('transport'),t('leisure'),t('shopping'),t('health'),t('home'),t('other')];if(!state._candidateCategories)state._candidateCategories=candidates.map((n,i)=>({id:'candidate-'+i,name:n,icon:['◌','◇','☆','□','♡','⌂','○'][i],selected:i<5,defaultBudget:null}));return `<h1>${t('onboarding6')}</h1><p>${t('chooseFive')} ${t('optionalAmounts')}</p><div class="category-pick">${state._candidateCategories.map(c=>`<label class="pick"><input type="checkbox" data-pick="${c.id}" ${c.selected?'checked':''}><span>${esc(c.icon)} ${esc(c.name)}</span></label>`).join('')}</div><div class="divider"></div><div id="selected-budget-list" class="editable-list">${state._candidateCategories.filter(c=>c.selected).map(c=>`<div class="editable-item" data-candidate-row="${c.id}"><input data-name value="${esc(c.name)}"><input data-amount inputmode="decimal" placeholder="${placeholderAmount()}" value="${c.defaultBudget??''}"><span></span></div>`).join('')}</div>`}return ''}
function bindOnboarding(){document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{state.settings.language=b.dataset.lang;renderOnboarding()});document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{state.settings.theme=b.dataset.theme;renderOnboarding()});document.querySelector('#on-currency')?.addEventListener('change',e=>state.settings.currency=e.target.value);document.querySelector('#on-day')?.addEventListener('change',e=>state.settings.incomeDay=Math.max(1,Math.min(31,Number(e.target.value)||25)));document.querySelector('#on-add-fixed')?.addEventListener('click',()=>{captureOnboardingFixed();state.fixedTemplates.push({id:uid(),name:'',amount:null,active:true});renderOnboarding()});document.querySelectorAll('[data-remove-fixed]').forEach(b=>b.onclick=()=>{captureOnboardingFixed();state.fixedTemplates=state.fixedTemplates.filter(x=>x.id!==b.dataset.removeFixed);renderOnboarding()});document.querySelectorAll('[data-pick]').forEach(ch=>ch.onchange=()=>{captureCandidates();const c=state._candidateCategories.find(x=>x.id===ch.dataset.pick);if(c)c.selected=ch.checked;renderOnboarding()});document.querySelector('#on-back')?.addEventListener('click',()=>{captureOnboardingStep();onboardingStep--;renderOnboarding()});document.querySelector('#on-next').onclick=()=>{captureOnboardingStep();if(onboardingStep===6){const selected=state._candidateCategories.filter(c=>c.selected);if(selected.length!==5){alert(t('chooseFive'));return}state.categoryTemplates=selected.map(c=>({id:uid(),name:c.name,icon:c.icon,defaultBudget:c.defaultBudget??null}));delete state._candidateCategories;state.settings.onboarded=true;state.ui.periodKey=monthKey(new Date());state.periods={};ensurePeriod(state.ui.periodKey);persist()}else{onboardingStep++;renderOnboarding()}}}
function captureOnboardingFixed(){document.querySelectorAll('[data-fixed-row]').forEach(r=>{const f=state.fixedTemplates.find(x=>x.id===r.dataset.fixedRow);if(f){f.name=r.querySelector('[data-name]').value.trim()||t('fixedCosts');f.amount=numOrNull(r.querySelector('[data-amount]').value)}})}
function captureCandidates(){document.querySelectorAll('[data-candidate-row]').forEach(r=>{const c=state._candidateCategories.find(x=>x.id===r.dataset.candidateRow);if(c){c.name=r.querySelector('[data-name]').value.trim()||t('other');c.defaultBudget=numOrNull(r.querySelector('[data-amount]').value)}})}
function captureOnboardingStep(){if(onboardingStep===2){const el=document.querySelector('#on-currency');if(el)state.settings.currency=el.value}if(onboardingStep===4){const el=document.querySelector('#on-day');if(el)state.settings.incomeDay=Math.max(1,Math.min(31,Number(el.value)||25))}if(onboardingStep===5)captureOnboardingFixed();if(onboardingStep===6)captureCandidates()}
window.addEventListener('error',e=>console.error('ZAYVA runtime error',e.error||e.message));
render();
})();
</script>
</body>
</html>
