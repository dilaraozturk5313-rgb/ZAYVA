function mergeState(base,saved){const out=Object.assign(base,saved);out.settings=Object.assign(base.settings,saved.settings||{});out.settings.cycle=Object.assign(base.settings.cycle,(saved.settings||{}).cycle||{});out.profile=Object.assign(base.profile,saved.profile||{});out.ui=Object.assign(base.ui,saved.ui||{});return out}

function monthKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function dateFromMonth(key){const [y,m]=String(key).split('-').map(Number);return new Date(y,m-1,15,12)}
function shiftMonth(key,delta){const d=dateFromMonth(key);d.setMonth(d.getMonth()+delta);return monthKey(d)}
function monthLabel(key){const d=dateFromMonth(key);const s=d.toLocaleDateString(state.settings.language==='sv'?'sv-SE':'en-US',{month:'long',year:'numeric'});return s.charAt(0).toUpperCase()+s.slice(1)}
function selectedAnchor(){return dateFromMonth(state.ui.selectedMonth||monthKey(new Date()))}
function cycleRange(anchor=selectedAnchor()){
 const c=state.settings.cycle||{};
 if(c.type==='calendar')return{start:new Date(anchor.getFullYear(),anchor.getMonth(),1),end:new Date(anchor.getFullYear(),anchor.getMonth()+1,0,23,59,59)};
 const day=c.type==='custom'?Number(c.customStartDay||1):Number(c.paydayDay||25);
 const d=Math.max(1,Math.min(28,day));
 const before=anchor.getDate()<d;
 const start=new Date(anchor.getFullYear(),anchor.getMonth()-(before?1:0),d);
 return{start,end:new Date(start.getFullYear(),start.getMonth()+1,d-1,23,59,59)};
}
const inRange=(ds,r)=>{const d=new Date(ds+'T12:00:00');return d>=r.start&&d<=r.end};

function catSpent(id){const r=cycleRange();return Math.abs(state.transactions.filter(x=>x.categoryId===id&&x.amount<0&&inRange(x.date,r)).reduce((a,b)=>a+b.amount,0))}

 if(w.kind==='notes'){const n=[...state.notes].sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)))[0];return '<article class="panel"><div class="panel-head"><h3>'+t('notes')+'</h3><button class="link-btn" data-route="more">'+t('viewAll')+'</button></div><p>'+(n?esc(n.title? n.title+': '+n.text:n.text):'—')+'</p></article>'}
 if(w.kind==='payday'){const days=Math.max(0,Math.ceil((s.range.end-new Date())/86400000));return '<article class="panel"><small>'+t('paydayCountdown')+'</small><div><strong class="big">'+days+'</strong> <span>d</span></div></article>'}
 return '<article class="panel"><small>'+t(w.label)+'</small><p class="muted">'+t('prepared')+'</p></article>'
}

function goals(){const total=state.savingsLog.reduce((a,b)=>a+Number(b.amount||0),0);return '<section class="view"><header class="page-head"><div><small>ZAYVA</small><h1>'+t('goals')+'</h1></div><button class="primary small" data-action="add-goal">＋</button></header><article class="panel"><div class="panel-head"><div><small>'+t('totalSaved')+'</small><div class="big">'+money(total)+'</div></div><button class="primary" data-action="add-saving">＋ '+t('savings')+'</button></div><h3 style="margin-top:18px">'+t('monthlySavings')+'</h3><div class="savings-log">'+[...state.savingsLog].sort((a,b)=>b.month.localeCompare(a.month)).map(x=>'<button data-saving="'+esc(x.id)+'"><span>'+esc(monthLabel(x.month))+'</span><strong>+'+money(x.amount)+'</strong></button>').join('')+'</div></article><div class="goal-grid">'+state.goals.map(g=>'<article class="panel"><div class="panel-head"><h3>'+esc(g.icon)+' '+esc(g.name)+'</h3><button class="link-btn" data-pin-goal="'+esc(g.id)+'">'+(g.pinned?'●':'○')+'</button></div><strong class="big">'+money(g.current)+'</strong><span> / '+money(g.target)+'</span>'+progress(g.current,g.target)+(g.due?'<p class="muted">'+esc(g.due)+'</p>':'')+'<button class="ghost" style="width:100%;margin-top:12px" data-edit-goal="'+esc(g.id)+'">'+t('edit')+'</button></article>').join('')+'</div></section>'}
function more(){const notes=[...state.notes].sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));return '<section class="view"><header class="page-head"><div><small>ZAYVA</small><h1>'+t('more')+'</h1></div></header><article class="panel"><div class="panel-head"><h3>'+t('homeWidgets')+'</h3><button class="primary" data-action="widgets">'+t('widgetLibrary')+'</button></div><p class="muted">'+t('widgetLibraryHint')+'</p></article><article class="panel"><div class="panel-head"><h3>'+t('notes')+'</h3><button class="primary small" data-action="add-note">＋</button></div><div class="notes-list">'+(notes.length?notes.map(n=>'<button data-note="'+esc(n.id)+'"><span><b>'+esc(n.title||t('notes'))+'</b><br><small>'+esc((n.text||'').slice(0,60))+'</small></span><span>'+esc(n.createdAt||'')+'</span></button>').join(''):'<div class="empty">'+t('noNotes')+'</div>')+'</div></article><article class="panel"><h3>'+t('theme')+'</h3><div class="theme-grid">'+Object.entries(THEMES).map(([id,v])=>'<button class="theme-swatch '+(state.settings.theme===id?'active':'')+'" data-theme="'+id+'"><i style="background:'+v.accent+'"></i><span>'+v.label+'</span></button>').join('')+'</div></article><article class="panel"><h3>'+t('settings')+'</h3><label>'+t('language')+'<select id="language"><option value="sv" '+(state.settings.language==='sv'?'selected':'')+'>Svenska</option><option value="en" '+(state.settings.language==='en'?'selected':'')+'>English</option></select></label><label>'+t('currency')+'<select id="currency">'+['SEK','EUR','USD'].map(c=>'<option value="'+c+'" '+(state.settings.currency===c?'selected':'')+'>'+c+'</option>').join('')+'</select></label><label>'+t('regularIncome')+'<input id="regular-income" type="number" value="'+Number(state.profile.regularIncome||0)+'"></label></article><article class="panel"><h3>'+t('more')+'</h3><div class="module-grid">'+[['accounts','accounts'],['investments','investments'],['debts','debts'],['networth','netWorth'],['cashflow','cashFlow'],['insights','insights']].map(([id,k])=>'<div class="module-card"><b>'+t(k)+'</b><span>'+t('prepared')+'</span></div>').join('')+'</div></article><article class="panel"><small>'+t('version')+' '+VERSION+'</small><button class="ghost danger" style="width:100%;margin-top:12px" id="reset">'+t('resetDemo')+'</button></article></section>'}

h-ob">'+t('openZayva')+'</button><p class="hint">'+t('complexSlogan')+'</p></div></main>'}
function render(){try{applyTheme();if(!state.onboardingComplete){app.innerHTML=onboarding();bindOnboarding();return}const view={home,activity,plan,goals,more}[route]||home;app.innerHTML=shell(view());bindCommon();if(route==='activity')bindActivity();if(route==='plan')bindPlan();if(route==='goals')bindGoals();if(route==='more')bindMore()}catch(err){console.error(err);app.innerHTML='<pre class="error">ZAYVA could not render.\n'+esc(err&&err.stack?err.stack:err)+'</pre>'}}
function bindCommon(){document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{route=b.dataset.route;render()});document.querySelectorAll('[data-action="transaction"]').forEach(b=>b.onclick=()=>transactionModal());document.querySelectorAll('[data-action="widgets"]').forEach(b=>b.onclick=widgetLibrary);document.querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>{state.ui.selectedMonth=shiftMonth(state.ui.selectedMonth,Number(b.dataset.month));save()})}
function bindOnboarding(){const lang=document.getElementById('ob-language');const cur=document.getElementById('ob-currency');lang.onchange=e=>{state.settings.language=e.target.value;save()};cur.onchange=e=>{state.settings.currency=e.target.value;save()};document.querySelectorAll('[data-ob-theme]').forEach(b=>b.onclick=()=>{state.settings.theme=b.dataset.obTheme;save()});document.querySelectorAll('[data-ob-cycle]').forEach(b=>b.onclick=()=>{state.settings.cycle.type=b.dataset.obCycle;save()});const d=document.getElementById('ob-cycle-day');if(d)d.onchange=e=>{const v=Math.max(1,Math.min(28,Number(e.target.value||1)));if(state.settings.cycle.type==='payday')state.settings.cycle.paydayDay=v;else state.settings.cycle.customStartDay=v;save(false)};document.getElementById('finish-ob').onclick=()=>{state.profile.regularIncome=Number(document.getElementById('ob-income').value||0);document.querySelectorAll('[data-ob-cat]').forEach(cb=>{const c=state.categories.find(x=>x.id===cb.dataset.obCat);if(c)c.pinned=cb.checked});state.onboardingComplete=true;save()}}
function transactionModal(id){const x=id?state.transactions.find(tn=>tn.id===id):null;const today=new Date().toISOString().slice(0,10);const type=x?.type||(x&&x.amount>0?'income':'purchase')||'purchase';const m=openModal('<h2>'+t(x?'editTransaction':'addTransaction')+'</h2><div class="segmented two"><button id="tx-type-purchase" class="'+(type==='purchase'?'active':'')+'">'+t('purchase')+'</button><button id="tx-type-income" class="'+(type==='income'?'active':'')+'">'+t('incomeType')+'</button></div><label>'+t('amount')+'<input id="tx-amount" type="number" inputmode="decimal" value="'+Math.abs(Number(x?.amount||0))+'"></label><div id="tx-cat-wrap"><label>'+t('category')+'<select id="tx-cat">'+state.categories.map(c=>'<option value="'+esc(c.id)+'" '+(x?.categoryId===c.id?'selected':'')+'>'+esc(catName(c))+'</option>').join('')+'</select></label></div><label>'+t('date')+'<input id="tx-date" type="date" value="'+esc(x?.date||today)+'"></label><label>'+t('title')+'<input id="tx-title" value="'+esc(x?.title||'')+'"></label><label>'+t('note')+'<textarea id="tx-note">'+esc(x?.note||'')+'</textarea></label><label>'+t('paymentAccount')+'<input id="tx-account" value="'+esc(x?.account||t('mainAccount'))+'"></label><button class="primary wide" id="save-tx">'+t('save')+'</button>'+(x?'<button class="ghost danger" style="width:100%;margin-top:8px" id="del-tx">'+t('delete')+'</button>':'') );let currentType=type;const sync=()=>{m.querySelector('#tx-type-purchase').classList.toggle('active',currentType==='purchase');m.querySelector('#tx-type-income').classList.toggle('active',currentType==='income');m.querySelector('#tx-cat-wrap').style.display=currentType==='purchase'?'block':'none'};m.querySelector('#tx-type-purchase').onclick=()=>{currentType='purchase';sync()};m.querySelector('#tx-type-income').onclick=()=>{currentType='income';sync()};sync();m.querySelector('#save-tx').onclick=()=>{const a=Math.abs(Number(m.querySelector('#tx-amount').value||0));if(!a)return;const obj={id:x?.id||uid(),type:currentType,amount:currentType==='income'?a:-a,categoryId:currentType==='purchase'?m.querySelector('#tx-cat').value:null,date:m.querySelector('#tx-date').value,title:m.querySelector('#tx-title').value||(currentType==='income'?t('incomeType'):t('purchase')),note:m.querySelector('#tx-note').value,account:m.querySelector('#tx-account').value||t('mainAccount')};if(x)Object.assign(x,obj);else state.transactions.push(obj);m.remove();save()};m.querySelector('#del-tx')?.addEventListener('click',()=>{if(confirm(t('confirmDelete'))){state.transactions=state.transactions.filter(tn=>tn.id!==x.id);m.remove();save()}})}
function widgetLibrary(){const m=openModal('<h2>'+t('widgetLibrary')+'</h2><p class="muted">'+t('widgetLibraryHint')+'</p><div class="widget-list">'+WIDGETS.map(w=>{const on=state.homeWidgets.includes(w.id);return '<div class="widget-choice"><span>'+t(w.label)+'</span><div class="widget-actions"><button '+(!on?'disabled':'')+' data-up="'+w.id+'">↑</button><button '+(!on?'disabled':'')+' data-down="'+w.id+'">↓</button><button data-widget="'+w.id+'">'+(on?t('remove'):t('add'))+'</button></div></div>'}).join('')+'</div>');m.querySelectorAll('[data-widget]').forEach(b=>b.onclick=()=>{const id=b.dataset.widget;state.homeWidgets=state.homeWidgets.includes(id)?state.homeWidgets.filter(x=>x!==id):state.homeWidgets.concat(id);m.remove();save()});m.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{moveWidget(b.dataset.up,-1);m.remove();save()});m.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{moveWidget(b.dataset.down,1);m.remove();save()})}
function moveWidget(id,delta){const i=state.homeWidgets.indexOf(id);if(i<0)return;const j=Math.max(0,Math.min(state.homeWidgets.length-1,i+delta));if(i===j)return;[state.homeWidgets[i],state.homeWidgets[j]]=[state.homeWidgets[j],state.homeWidgets[i]]}

function categoryModal(id){const c=state.categories.find(x=>x.id===id);const m=openModal('<h2>'+t(c?'edit':'newCategory')+'</h2><label>'+t('name')+'<input id="c-name" value="'+esc(c?catName(c):'')+'"></label><label>'+t('budget')+'<input id="c-budget" type="number" value="'+Number(c?.budget||0)+'"></label><label>'+t('icon')+'<input id="c-icon" value="'+esc(c?.icon||'○')+'"></label><label style="flex-direction:row;align-items:center"><input id="c-pin" type="checkbox" '+(c?.pinned?'checked':'')+'> '+t('categoryPinned')+'</label><button class="primary wide" id="c-save">'+t('save')+'</button>'+(c?'<button class="ghost danger" style="width:100%;margin-top:8px" id="c-del">'+t('delete')+'</button>':'') );m.querySelector('#c-save').onclick=()=>{const name=m.querySelector('#c-name').value.trim()||t('newCategory');const obj={id:c?.id||uid(),name,icon:m.querySelector('#c-icon').value||'○',budget:Number(m.querySelector('#c-budget').value||0),pinned:m.querySelector('#c-pin').checked};if(c){delete c.nameSv;delete c.nameEn;Object.assign(c,obj)}else state.categories.push(obj);m.remove();save()};m.querySelector('#c-del')?.addEventListener('click',()=>{if(confirm(t('confirmDelete'))){state.categories=state.categories.filter(x=>x.id!==c.id);m.remove();save()}})}
function fixedModal(id){const f=state.fixedCosts.find(x=>x.id===id);const m=openModal('<h2>'+t(f?'edit':'addFixed')+'</h2><label>'+t('name')+'<input id="f-name" value="'+esc(f?.name||'')+'"></label><label>'+t('amount')+'<input id="f-amount" type="number" value="'+Number(f?.amount||0)+'"></label><label>'+t('day')+'<input id="f-day" type="number" min="1" max="31" value="'+Number(f?.day||1)+'"></label><label style="flex-direction:row;align-items:center"><input id="f-active" type="checkbox" '+((f?.active??true)?'checked':'')+'> '+t('active')+'</label><button class="primary wide" id="f-save">'+t('save')+'</button>'+(f?'<button class="ghost danger" style="width:100%;margin-top:8px" id="f-del">'+t('delete')+'</button>':'') );m.querySelector('#f-save').onclick=()=>{const obj={id:f?.id||uid(),name:m.querySelector('#f-name').value.trim()||t('fixedCosts'),amount:Number(m.querySelector('#f-amount').value||0),day:Math.max(1,Math.min(31,Number(m.querySelector('#f-day').value||1))),active:m.querySelector('#f-active').checked};if(f)Object.assign(f,obj);else state.fixedCosts.push(obj);m.remove();save()};m.querySelector('#f-del')?.addEventListener('click',()=>{if(confirm(t('confirmDelete'))){state.fixedCosts=state.fixedCosts.filter(x=>x.id!==f.id);m.remove();save()}})}
function bindGoals(){document.querySelector('[data-action="add-goal"]').onclick=()=>goalModal();document.querySelector('[data-action="add-saving"]').onclick=()=>savingModal();document.querySelectorAll('[data-edit-goal]').forEach(b=>b.onclick=()=>goalModal(b.dataset.editGoal));document.querySelectorAll('[data-pin-goal]').forEach(b=>b.onclick=()=>{const g=state.goals.find(x=>x.id===b.dataset.pinGoal);if(g){g.pinned=!g.pinned;save()}});document.querySelectorAll('[data-saving]').forEach(b=>b.onclick=()=>savingModal(b.dataset.saving))}
function savingModal(id){const s=state.savingsLog.find(x=>x.id===id);const m=openModal('<h2>'+t(s?'editSaving':'addSaving')+'</h2><label>'+t('month')+'<input id="s-month" type="month" value="'+esc(s?.month||state.ui.selectedMonth)+'"></label><label>'+t('amount')+'<input id="s-amount" type="number" value="'+Number(s?.amount||0)+'"></label><label>'+t('note')+'<input id="s-note" value="'+esc(s?.note||'')+'"></label><button class="primary wide" id="s-save">'+t('save')+'</button>'+(s?'<button class="ghost danger" style="width:100%;margin-top:8px" id="s-del">'+t('delete')+'</button>':'') );m.querySelector('#s-save').onclick=()=>{const obj={id:s?.id||uid(),month:m.querySelector('#s-month').value||state.ui.selectedMonth,amount:Number(m.querySelector('#s-amount').value||0),note:m.querySelector('#s-note').value};if(s)Object.assign(s,obj);else state.savingsLog.push(obj);m.remove();save()};m.querySelector('#s-del')?.addEventListener('click',()=>{if(confirm(t('confirmDelete'))){state.savingsLog=state.savingsLog.filter(x=>x.id!==s.id);m.remove();save()}})}
function goalModal(id){const g=state.goals.find(x=>x.id===id);const m=openModal('<h2>'+t(g?'edit':'addGoal')+'</h2><label>'+t('name')+'<input id="g-name" value="'+esc(g?.name||'')+'"></label><label>'+t('target')+'<input id="g-target" type="number" value="'+Number(g?.target||0)+'"></label><label>'+t('current')+'<input id="g-current" type="number" value="'+Number(g?.current||0)+'"></label><label>'+t('dueDate')+'<input id="g-date" type="date" value="'+esc(g?.due||'')+'"></label><label>'+t('icon')+'<input id="g-icon" value="'+esc(g?.icon||'◎')+'"></label><label style="flex-direction:row;align-items:center"><input id="g-pin" type="checkbox" '+(g?.pinned?'checked':'')+'> '+t('goalPinned')+'</label><button class="primary wide" id="g-save">'+t('save')+'</button>'+(g?'<button class="ghost danger" style="width:100%;margin-top:8px" id="g-del">'+t('delete')+'</button>':'') );m.querySelector('#g-save').onclick=()=>{const obj={id:g?.id||uid(),name:m.querySelector('#g-name').value.trim()||t('newGoal'),target:Number(m.querySelector('#g-target').value||0),current:Number(m.querySelector('#g-current').value||0),due:m.querySelector('#g-date').value,icon:m.querySelector('#g-icon').value||'◎',pinned:m.querySelector('#g-pin').checked};if(g)Object.assign(g,obj);else state.goals.push(obj);m.remove();save()};m.querySelector('#g-del')?.addEventListener('click',()=>{if(confirm(t('confirmDelete'))){state.goals=state.goals.filter(x=>x.id!==g.id);m.remove();save()}})}
function bindMore(){document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{state.settings.theme=b.dataset.theme;save()});document.getElementById('language').onchange=e=>{state.settings.language=e.target.value;save()};document.getElementById('currency').onchange=e=>{state.settings.currency=e.target.value;save()};document.getElementById('regular-income').onchange=e=>{state.profile.regularIncome=Number(e.target.value||0);save()};document.querySelector('[data-action="add-note"]').onclick=()=>noteModal();document.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>noteModal(b.dataset.note));document.getElementById('reset').onclick=()=>{if(confirm(t('resetConfirm'))){state=clone(DEFAULT);localStorage.removeItem(KEY);route='home';render()}}}
function noteModal(id){const n=state.notes.find(x=>x.id===id);const m=openModal('<h2>'+t(n?'editNote':'newNote')+'</h2><label>'+t('title')+'<input id="n-title" value="'+esc(n?.title||'')+'"></label><label>'+t('note')+'<textarea id="n-text">'+esc(n?.text||'')+'</textarea></label><button class="primary wide" id="n-save">'+t('save')+'</button>'+(n?'<button class="ghost danger" style="width:100%;margin-top:8px" id="n-del">'+t('delete')+'</button>':'') );m.querySelector('#n-save').onclick=()=>{const obj={id:n?.id||uid(),title:m.querySelector('#n-title').value.trim(),text:m.querySelector('#n-text').value,createdAt:n?.createdAt||new Date().toISOString().slice(0,10)};if(n)Object.assign(n,obj);else state.notes.push(obj);m.remove();save()};m.querySelector('#n-del')?.addEventListener('click',()=>{if(confirm(t('confirmDelete'))){state.notes=state.notes.filter(x=>x.id!==n.id);m.remove();save()}})}
window.addEventListener('error',e=>{console.error('ZAYVA runtime error',e.error||e.message)});
render();
})();
</script>
</body>
</html>
