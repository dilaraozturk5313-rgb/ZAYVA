function quickFormHTML(catId=''){const p=period(),b=periodBounds(state.ui.periodKey);const today=new Date();let d=(today>=b.start&&today<=b.end)?dateISO(today):dateISO(b.start);const initial=catId||'';return `<form class="quick-form"><div class="form-row"><div class="field"><label>${t('amount')}</label><input name="amount" inputmode="decimal" placeholder="${placeholderAmount()}" required></div><div class="field"><label>${t('date')}</label><input name="date" type="date" value="${d}"></div></div><div class="field"><label>${t('description')}</label><input name="title" placeholder="${t('description')}"></div><div class="field"><label>${t('note')}</label><input name="note" placeholder="${t('note')}"></div><div class="field"><label>${t('category')}</label><input type="hidden" name="category" value="${initial}"><div class="category-choices">${state.categoryTemplates.map(c=>`<button type="button" class="category-choice ${c.id===initial?'selected':''}" data-cat-choice="${c.id}">${esc(c.name)}</button>`).join('')}</div></div><button class="btn wide" type="submit">${t('register')}</button></form>`}
function bindQuickForm(form,forcedCat){if(!form)return;form.querySelectorAll('[data-cat-choice]').forEach(b=>b.onclick=()=>{form.querySelectorAll('[data-cat-choice]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');form.querySelector('[name="category"]').value=b.dataset.catChoice});form.onsubmit=e=>{e.preventDefault();const fd=new FormData(form);const cat=forcedCat||String(fd.get('category')||'');if(!cat)return;registerPurchase(fd,forcedCat);form.reset();if(forcedCat){form.querySelector('[name="category"]').value=forcedCat;form.querySelector(`[data-cat-choice="${forcedCat}"]`)?.classList.add('selected')}render()}}
function categoryListHTML(){if(!state.categoryTemplates.length)return `<div class="card empty">${t('chooseFive')}</div>`;const p=period();return state.categoryTemplates.map(c=>{const b=catBudget(c.id,p),s=catSpent(c.id,p),r=b===null?null:Number(b)-s;return `<button class="cat-row" data-category="${c.id}"><div class="top"><div class="name"><span>${esc(c.name)}</span></div><b>${money(r)}</b></div><div class="meta">${t('catSpent')}: ${money(s)} · ${t('catBudget')}: ${money(b)}</div><div class="progress"><span style="width:${pct(s,b)}%"></span></div></button>`}).join('')}
function fixedCostsHTML(){const p=period(),list=activeFixed(p);return `<div class="fixed-box"><div class="fixed-head"><div><h3>${t('fixedCosts')}</h3><div class="tiny-note">${t('fixedCostsSub')}</div></div><button class="btn secondary" data-action="open-more">${t('edit')}</button></div>${list.length?list.map(f=>`<div class="fixed-line"><span>${esc(f.name)}</span><b>${money(f.amount)}</b></div>`).join(''):`<div class="empty">${t('fixedCosts')}</div>`}<div class="fixed-total"><span>${t('totalFixed')}</span><span>${money(activeFixed().some(f=>f.amount!==null&&f.amount!==undefined)?fixedTotal(p):null)}</span></div></div>`}
function transactionsHTML(){const xs=[...purchases()].sort((a,b)=>b.date.localeCompare(a.date));if(!xs.length)return `<div class="empty">${t('noTransactions')}</div>`;return xs.map(x=>{const c=state.categoryTemplates.find(c=>c.id===x.categoryId);return `<div class="tx"><div class="left"><b>${esc(x.title||c?.name||t('purchase'))}</b><small>${esc(c?.name||'')} · ${esc(x.date)}</small>${x.note?`<div class="tx-note">${esc(x.note)}</div>`:''}</div><div class="tx-right"><b>−${money(x.amount)}</b><div class="tx-actions"><button class="mini-btn" data-edit-tx="${x.id}">${t('edit')}</button><button class="mini-btn delete" data-delete-tx="${x.id}">${t('delete')}</button></div></div></div>`}).join('')}
function savingsHTML(){const p=period();return `<div class="card"><div class="remaining-block" style="border:0;padding-top:0"><div class="tiny">${t('periodSavings')}</div><div class="big-money">${money(savedTotal(p)||null)}</div></div>${p.savings.length?p.savings.map(s=>`<div class="tx"><div class="left"><b>${esc(s.note||t('savings'))}</b><small>${esc(s.date)}</small></div><b>${money(s.amount)}</b></div>`).join(''):`<div class="empty">${t('noSavings')}</div>`}</div>`}
function goalsHTML(){if(!state.goals.length)return `<div class="card empty">${t('addGoal')}</div>`;return state.goals.map(g=>`<div class="goal clickable" data-goal="${g.id}"><div class="head"><b>${esc(g.name)}</b><span>${money(g.current)} / ${money(g.target)}</span></div><div class="progress"><span style="width:${pct(g.current,g.target)}%"></span></div></div>`).join('')}
function navHTML(){return `<nav class="bottom-nav"><button data-scroll="overview"><span class="nav-icon">⌂</span>${t('overview')}</button><button data-scroll="budget"><span class="nav-icon">▤</span>${t('budget')}</button><button class="more-btn" data-action="open-more"><span class="more-circle">•••</span>${t('more')}</button><button data-scroll="purchase"><span class="nav-icon">◇</span>${t('purchase')}</button><button data-scroll="savings"><span class="nav-icon">◎</span>${t('savings')}</button></nav>`}
function bindMain(){document.querySelectorAll('[data-shift]').forEach(b=>b.onclick=()=>{state.ui.periodKey=shiftKey(state.ui.periodKey,Number(b.dataset.shift));ensurePeriod(state.ui.periodKey);persist()});document.querySelectorAll('[data-scroll]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.scroll)?.scrollIntoView({behavior:'smooth',block:'start'}));document.querySelectorAll('[data-action="open-more"]').forEach(b=>b.onclick=openMore);document.querySelectorAll('[data-action="edit-income"]').forEach(b=>b.onclick=editIncome);document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>categorySheet(b.dataset.category));document.querySelector('[data-action="add-saving"]')?.addEventListener('click',savingSheet);document.querySelector('[data-action="add-goal"]')?.addEventListener('click',()=>goalSheet());document.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>goalSheet(b.dataset.goal));document.querySelectorAll('.quick-form').forEach(f=>bindQuickForm(f));document.querySelectorAll('[data-edit-tx]').forEach(b=>b.onclick=()=>transactionSheet(b.dataset.editTx));document.querySelectorAll('[data-delete-tx]').forEach(b=>b.onclick=()=>{const p=period();p.transactions=p.transactions.filter(x=>x.id!==b.dataset.deleteTx);persist()})}
function registerPurchase(fd,forcedCat){const amount=numOrNull(fd.get('amount'));if(amount===null||amount<=0)return;const date=String(fd.get('date')||dateISO(new Date()));const key=periodKeyForDate(date);const p=ensurePeriod(key);const cat=forcedCat||String(fd.get('category')||'');if(!cat)return;p.transactions.push({id:uid(),type:'purchase',amount,categoryId:cat,date,title:String(fd.get('title')||''),note:String(fd.get('note')||'')});localStorage.setItem(STORAGE,JSON.stringify(state))}
function showSheet(html){const wrap=document.createElement('div');wrap.className='sheet-backdrop';wrap.innerHTML=`<div class="sheet">${html}</div>`;document.body.appendChild(wrap);wrap.addEventListener('click',e=>{if(e.target===wrap)wrap.remove()});wrap.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>wrap.remove());return wrap}
function sheetHead(title){return `<div class="sheet-head"><h2>${title}</h2><button class="close" data-close>×</button></div>`}
function editIncome(){const p=period();const s=showSheet(`${sheetHead(t('periodIncome'))}<div class="field"><label>${t('income')}</label><input id="income-edit" inputmode="decimal" value="${p.income??''}" placeholder="${placeholderAmount()}"></div><div class="tiny-note">${esc(periodTitle(state.ui.periodKey))} · ${fmtDate(periodBounds(state.ui.periodKey).start)} – ${fmtDate(periodBounds(state.ui.periodKey).end)}</div><button class="btn wide" id="save-income">${t('save')}</button>`);s.querySelector('#save-income').onclick=()=>{p.income=numOrNull(s.querySelector('#income-edit').value);s.remove();persist()}}
function categorySheet(id){const c=state.categoryTemplates.find(x=>x.id===id);if(!c)return;const p=period(),b=catBudget(id,p),sp=catSpent(id,p),rem=b===null?null:Number(b)-sp;const s=showSheet(`${sheetHead(esc(c.name))}<div class="grid"><div class="card metric"><div class="label">${t('catBudget')}</div><div class="value">${money(b)}</div></div><div class="card metric"><div class="label">${t('catSpent')}</div><div class="value">${money(sp)}</div></div></div><div class="card metric" style="margin-top:10px"><div class="label">${t('catRemaining')}</div><div class="value">${money(rem)}</div><div class="progress"><span style="width:${pct(sp,b)}%"></span></div></div><div class="card" style="margin-top:10px"><h3>${t('editBudget')}</h3><div class="field"><input id="period-budget" inputmode="decimal" value="${b??''}" placeholder="${placeholderAmount()}"></div><button class="btn secondary wide" id="save-period-budget">${t('save')}</button></div><div class="card quick-card" style="margin-top:10px"><h3>${t('registerHere')}</h3>${quickFormHTML(id)}</div>`);s.querySelector('#save-period-budget').onclick=()=>{p.categoryBudgets[id]=numOrNull(s.querySelector('#period-budget').value);s.remove();persist()};const f=s.querySelector('.quick-form');bindQuickForm(f,id)}
function transactionSheet(id){const p=period();const x=p.transactions.find(v=>v.id===id);if(!x)return;const s=showSheet(`${sheetHead(t('edit'))}<div class="field"><label>${t('amount')}</label><input id="tx-amount" inputmode="decimal" value="${x.amount??''}"></div><div class="field"><label>${t('description')}</label><input id="tx-title" value="${esc(x.title||'')}"></div><div class="field"><label>${t('note')}</label><input id="tx-note" value="${esc(x.note||'')}"></div><div class="field"><label>${t('date')}</label><input id="tx-date" type="date" value="${esc(x.date)}"></div><div class="field"><label>${t('category')}</label><select id="tx-cat">${state.categoryTemplates.map(c=>`<option value="${c.id}" ${c.id===x.categoryId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><button class="btn wide" id="tx-save">${t('save')}</button>`);s.querySelector('#tx-save').onclick=()=>{const amount=numOrNull(s.querySelector('#tx-amount').value);if(amount===null||amount<=0)return;const date=s.querySelector('#tx-date').value;const newKey=periodKeyForDate(date);const updated={...x,amount,title:s.querySelector('#tx-title').value,note:s.querySelector('#tx-note').value,date,categoryId:s.querySelector('#tx-cat').value};p.transactions=p.transactions.filter(v=>v.id!==id);ensurePeriod(newKey).transactions.push(updated);s.remove();persist()}}
function savingSheet(){const b=periodBounds(state.ui.periodKey);const s=showSheet(`${sheetHead(t('addSaving'))}<div class="field"><label>${t('amount')}</label><input id="sav-amt" inputmode="decimal" placeholder="${placeholderAmount()}"></div><div class="field"><label>${t('date')}</label><input id="sav-date" type="date" value="${dateISO(b.start)}"></div><div class="field"><label>${t('note')}</label><input id="sav-note" placeholder="${t('note')}"></div><button class="btn wide" id="sav-save">${t('save')}</button>`);s.querySelector('#sav-save').onclick=()=>{const a=numOrNull(s.querySelector('#sav-amt').value);if(a!==null&&a>0){const date=s.querySelector('#sav-date').value;ensurePeriod(periodKeyForDate(date)).savings.push({id:uid(),amount:a,date,note:s.querySelector('#sav-note').value});s.remove();persist()}}}
function goalSheet(id){const g=state.goals.find(x=>x.id===id);const s=showSheet(`${sheetHead(g?esc(g.name):t('addGoal'))}<div class="field"><label>${t('goalName')}</label><input id="g-name" value="${esc(g?.name||'')}"></div><div class="form-row"><div class="field"><label>${t('target')}</label><input id="g-target" inputmode="decimal" value="${g?.target??''}" placeholder="${placeholderAmount()}"></div><div class="field"><label>${t('current')}</label><input id="g-current" inputmode="decimal" value="${g?.current??''}" placeholder="${placeholderAmount()}"></div></div><button class="btn wide" id="g-save">${t('save')}</button>${g?`<button class="btn danger wide" style="margin-top:8px" id="g-del">${t('delete')}</button>`:''}`);s.querySelector('#g-save').onclick=()=>{const obj={id:g?.id||uid(),name:s.querySelector('#g-name').value.trim()||t('goals'),target:numOrNull(s.querySelector('#g-target').value),current:numOrNull(s.querySelector('#g-current').value)};if(g)Object.assign(g,obj);else state.goals.push(obj);s.remove();persist()};s.querySelector('#g-del')?.addEventListener('click',()=>{state.goals=state.goals.filter(x=>x.id!==g.id);s.remove();persist()})}
function openMore(){const p=period();const s=showSheet(`${sheetHead(t('more'))}<div class="settings-list">
<div class="settings-block"><h3>${t('settings')}</h3><div class="row"><span>${t('language')}</span><select id="set-lang"><option value="sv" ${state.settings.language==='sv'?'selected':''}>Svenska</option><option value="en" ${state.settings.language==='en'?'selected':''}>English</option></select></div><div class="row"><span>${t('currency')}</span><select id="set-cur">${['SEK','EUR','USD','GBP','NOK','DKK'].map(c=>`<option ${state.settings.currency===c?'selected':''}>${c}</option>`).join('')}</select></div><div><span>${t('theme')}</span><div class="theme-picker" id="theme-picker">${Object.entries(THEMES).map(([k,v])=>`<button type="button" class="theme-option ${state.settings.theme===k?'selected':''}" data-set-theme="${k}"><div class="theme-dot" style="background:${v.swatches[0]}"></div><b>${v.label}</b></button>`).join('')}</div><input type="hidden" id="set-theme" value="${state.settings.theme}"></div></div>
<div class="settings-block"><h3>${t('budgetCycle')}</h3><div class="row"><span>${t('incomeDay')}</span><input id="set-day" type="number" min="1" max="31" value="${state.settings.incomeDay}"></div><div class="tiny-note">${t('incomeDayHint')}<br>${fmtDate(periodBounds(state.ui.periodKey).start)} – ${fmtDate(periodBounds(state.ui.periodKey).end)}</div></div>
<div class="settings-block"><h3>${t('periodIncome')}</h3><div class="row"><span>${esc(periodTitle(state.ui.periodKey))}</span><input id="set-income" inputmode="decimal" value="${p.income??''}" placeholder="${placeholderAmount()}"></div></div>
<div class="settings-block"><h3>${t('fixedEditor')}</h3><div class="tiny-note">${t('fixedCarry')}</div><div id="fixed-editor" class="editable-list">${fixedEditorHTML()}</div><button class="btn secondary" id="add-fixed" style="margin-top:8px">${t('add')}</button></div>
<div class="settings-block"><h3>${t('editBudget')}</h3><div class="tiny-note">${esc(periodTitle(state.ui.periodKey))} – ändras bara för denna period.</div><div id="period-cat-editor" class="editable-list" style="margin-top:9px">${periodCategoryEditorHTML()}</div></div>
<div class="settings-block"><h3>${t('defaultBudget')}</h3><div class="tiny-note">${t('templateNote')}</div><div id="cat-editor" class="editable-list" style="margin-top:9px">${categoryEditorHTML()}</div><button class="btn secondary" id="add-cat" style="margin-top:8px">${t('add')}</button></div>
<div class="settings-block"><h3>${t('focusEditor')}</h3><div class="tiny-note">Ett personligt delmål eller en önskning.</div><div class="field" style="margin-top:8px"><input id="focus-text" value="${esc(state.focusText||'')}" placeholder="Ex. Bygga buffert till 60 000 kr"></div></div>
<div class="settings-block"><h3>${t('notes')}</h3><div class="field"><textarea id="notes-box" placeholder="${t('notes')}">${esc(state.notes[0]?.text||'')}</textarea></div></div>
<button class="btn wide" id="save-more">${t('save')}</button><button class="btn danger wide" style="margin-top:8px" id="reset-app">${t('reset')}</button>
</div>`);bindMoreSheet(s)}
function fixedEditorHTML(){return state.fixedTemplates.map(f=>`<div class="editable-item" data-fixed-row="${f.id}"><input data-name value="${esc(f.name)}"><input data-amount inputmode="decimal" value="${f.amount??''}" placeholder="${placeholderAmount()}"><button data-remove-fixed="${f.id}">×</button></div>`).join('')}
function categoryEditorHTML(){return state.categoryTemplates.map(c=>`<div class="editable-item" data-cat-row="${c.id}"><input data-name value="${esc(c.name)}"><input data-amount inputmode="decimal" value="${c.defaultBudget??''}" placeholder="${placeholderAmount()}"><button data-remove-cat="${c.id}">×</button></div>`).join('')}
function periodCategoryEditorHTML(){const p=period();return state.categoryTemplates.map(c=>`<div class="editable-item" data-period-cat-row="${c.id}"><input value="${esc(c.name)}" disabled><input data-amount inputmode="decimal" value="${p.categoryBudgets[c.id]??''}" placeholder="${placeholderAmount()}"><span></span></div>`).join('')}
function capturePeriodBudgets(s){const p=period();s.querySelectorAll('[data-period-cat-row]').forEach(r=>{p.categoryBudgets[r.dataset.periodCatRow]=numOrNull(r.querySelector('[data-amount]').value)})}
function captureMoreEditors(s){s.querySelectorAll('[data-fixed-row]').forEach(r=>{const f=state.fixedTemplates.find(x=>x.id===r.dataset.fixedRow);if(f){f.name=r.querySelector('[data-name]').value.trim()||t('fixedCosts');f.amount=numOrNull(r.querySelector('[data-amount]').value)}});s.querySelectorAll('[data-cat-row]').forEach(r=>{const c=state.categoryTemplates.find(x=>x.id===r.dataset.catRow);if(c){c.name=r.querySelector('[data-name]').value.trim()||t('other');c.defaultBudget=numOrNull(r.querySelector('[data-amount]').value)}})}
function bindMoreSheet(s){const reopen=()=>{s.remove();localStorage.setItem(STORAGE,JSON.stringify(state));openMore()};s.querySelector('#add-fixed').onclick=()=>{captureMoreEditors(s);state.fixedTemplates.push({id:uid(),name:'',amount:null,active:true});reopen()};s.querySelector('#add-cat').onclick=()=>{captureMoreEditors(s);state.categoryTemplates.push({id:uid(),name:t('other'),defaultBudget:null});reopen()};s.querySelectorAll('[data-remove-fixed]').forEach(b=>b.onclick=()=>{captureMoreEditors(s);state.fixedTemplates=state.fixedTemplates.filter(x=>x.id!==b.dataset.removeFixed);reopen()});s.querySelectorAll('[data-remove-cat]').forEach(b=>b.onclick=()=>{captureMoreEditors(s);const id=b.dataset.removeCat;state.categoryTemplates=state.categoryTemplates.filter(x=>x.id!==id);Object.values(state.periods).forEach(p=>delete p.categoryBudgets[id]);reopen()});s.querySelectorAll('[data-set-theme]').forEach(b=>b.onclick=()=>{s.querySelectorAll('[data-set-theme]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');s.querySelector('#set-theme').value=b.dataset.setTheme;state.settings.theme=b.dataset.setTheme;applyTheme()});s.querySelector('#save-more').onclick=()=>{captureMoreEditors(s);capturePeriodBudgets(s);state.settings.language=s.querySelector('#set-lang').value;state.settings.currency=s.querySelector('#set-cur').value;state.settings.theme=s.querySelector('#set-theme').value;state.settings.incomeDay=Math.max(1,Math.min(31,Number(s.querySelector('#set-day').value)||25));const p=period();p.income=numOrNull(s.querySelector('#set-income').value);p.fixedCosts=state.fixedTemplates.filter(f=>f.active!==false).map(f=>({id:f.id,name:f.name,amount:f.amount??null,active:true}));state.focusText=s.querySelector('#focus-text')?.value.trim()||'';state.notes=[{id:'main-note',text:s.querySelector('#notes-box').value}];s.remove();persist()};s.querySelector('#reset-app').onclick=()=>{if(confirm(t('confirmReset'))){localStorage.removeItem(STORAGE);state=clone(DEFAULT);s.remove();applyTheme();render()}}}
function renderOnboarding(){applyTheme();root.innerHTML=`<div class="onboarding"><div class="on-card"><div class="brand">ZAYVA</div><div class="step">${onboardingStep} / 6</div>${onboardingBody()}<div class="on-actions">${onboardingStep>1?`<button class="btn secondary" id="on-back">${t('back')}</button>`:'<span></span>'}<button class="btn" id="on-next">${onboardingStep===6?t('finish'):t('next')}</button></div></div></div>`;bindOnboarding()}
function onboardingBody(){if(onboardingStep===1)return `<h1>${t('onboarding1')}</h1><div class="option-grid"><button class="option ${state.settings.language==='sv'?'selected':''}" data-lang="sv">Svenska</button><button class="option ${state.settings.language==='en'?'selected':''}" data-lang="en">English</button></div>`;if(onboardingStep===2)return `<h1>${t('onboarding2')}</h1><div class="field"><select id="on-currency">${['SEK','EUR','USD','GBP','NOK','DKK'].map(c=>`<option ${state.settings.currency===c?'selected':''}>${c}</option>`).join('')}</select></div>`;if(onboardingStep===3)return `<h1>${t('onboarding3')}</h1><div class="option-grid">${Object.entries(THEMES).map(([k,v])=>`<button class="option ${state.settings.theme===k?'selected':''}" data-theme="${k}"><div class="theme-dot" style="background:${v.swatches[0]}"></div><b>${v.label}</b></button>`).join('')}</div>`;if(onboardingStep===4)return `<h1>${t('onboarding4')}</h1><p>${t('incomeDayHint')}</p><div class="field"><label>${t('incomeDay')}</label><input id="on-day" type="number" min="1" max="31" value="${state.settings.incomeDay}"></div>`;if(onboardingStep===5){if(!state.fixedTemplates.length)state.fixedTemplates=[{id:uid(),name:t('rent'),amount:null,active:true},{id:uid(),name:t('fee'),amount:null,active:true},{id:uid(),name:t('mortgage'),amount:null,active:true},{id:uid(),name:t('loan'),amount:null,active:true},{id:uid(),name:t('insurance'),amount:null,active:true}];return `<h1>${t('onboarding5')}</h1><p>${t('optionalAmounts')}</p><div class="editable-list" id="on-fixed">${fixedEditorHTML()}</div><button class="btn secondary" id="on-add-fixed" style="margin-top:10px">${t('add')}</button>`}if(onboardingStep===6){const candidates=[t('food'),t('transport'),t('leisure'),t('shopping'),t('health'),t('home'),t('other')];if(!state._candidateCategories)state._candidateCategories=candidates.map((n,i)=>({id:'candidate-'+i,name:n,selected:i<5,defaultBudget:null}));return `<h1>${t('onboarding6')}</h1><p>${t('chooseFive')} ${t('optionalAmounts')}</p><div class="category-pick">${state._candidateCategories.map(c=>`<label class="pick"><input type="checkbox" data-pick="${c.id}" ${c.selected?'checked':''}><span>${esc(c.name)}</span></label>`).join('')}</div><div class="divider"></div><div id="selected-budget-list" class="editable-list">${state._candidateCategories.filter(c=>c.selected).map(c=>`<div class="editable-item" data-candidate-row="${c.id}"><input data-name value="${esc(c.name)}"><input data-amount inputmode="decimal" placeholder="${placeholderAmount()}" value="${c.defaultBudget??''}"><span></span></div>`).join('')}</div>`}return ''}
function bindOnboarding(){document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{state.settings.language=b.dataset.lang;renderOnboarding()});document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{state.settings.theme=b.dataset.theme;renderOnboarding()});document.querySelector('#on-currency')?.addEventListener('change',e=>state.settings.currency=e.target.value);document.querySelector('#on-day')?.addEventListener('change',e=>state.settings.incomeDay=Math.max(1,Math.min(31,Number(e.target.value)||25)));document.querySelector('#on-add-fixed')?.addEventListener('click',()=>{captureOnboardingFixed();state.fixedTemplates.push({id:uid(),name:'',amount:null,active:true});renderOnboarding()});document.querySelectorAll('[data-remove-fixed]').forEach(b=>b.onclick=()=>{captureOnboardingFixed();state.fixedTemplates=state.fixedTemplates.filter(x=>x.id!==b.dataset.removeFixed);renderOnboarding()});document.querySelectorAll('[data-pick]').forEach(ch=>ch.onchange=()=>{captureCandidates();const c=state._candidateCategories.find(x=>x.id===ch.dataset.pick);if(c)c.selected=ch.checked;renderOnboarding()});document.querySelector('#on-back')?.addEventListener('click',()=>{captureOnboardingStep();onboardingStep--;renderOnboarding()});document.querySelector('#on-next').onclick=()=>{captureOnboardingStep();if(onboardingStep===6){const selected=state._candidateCategories.filter(c=>c.selected);if(selected.length!==5){alert(t('chooseFive'));return}state.categoryTemplates=selected.map(c=>({id:uid(),name:c.name,defaultBudget:c.defaultBudget??null}));delete state._candidateCategories;state.settings.onboarded=true;state.ui.periodKey=monthKey(new Date());state.periods={};ensurePeriod(state.ui.periodKey);persist()}else{onboardingStep++;renderOnboarding()}}}
function captureOnboardingFixed(){document.querySelectorAll('[data-fixed-row]').forEach(r=>{const f=state.fixedTemplates.find(x=>x.id===r.dataset.fixedRow);if(f){f.name=r.querySelector('[data-name]').value.trim()||t('fixedCosts');f.amount=numOrNull(r.querySelector('[data-amount]').value)}})}
function captureCandidates(){document.querySelectorAll('[data-candidate-row]').forEach(r=>{const c=state._candidateCategories.find(x=>x.id===r.dataset.candidateRow);if(c){c.name=r.querySelector('[data-name]').value.trim()||t('other');c.defaultBudget=numOrNull(r.querySelector('[data-amount]').value)}})}
function captureOnboardingStep(){if(onboardingStep===2){const el=document.querySelector('#on-currency');if(el)state.settings.currency=el.value}if(onboardingStep===4){const el=document.querySelector('#on-day');if(el)state.settings.incomeDay=Math.max(1,Math.min(31,Number(el.value)||25))}if(onboardingStep===5)captureOnboardingFixed();if(onboardingStep===6)captureCandidates()}
window.addEventListener('error',e=>console.error('ZAYVA runtime error',e.error||e.message));
render();
})();
</script>
</body>
</html>
